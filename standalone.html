/* ===== js/canvas.js ===== */
/* ============================================================
   canvas.js — Editor livre estilo "Canva" (touch-friendly)
   Trabalha sobre um objeto `design`:
     design = { bg:{type,color,color1,color2,angle,image}, els:[element] }
     element = { id,type,x,y,w,h,rot, ...props }   (x/y/w/h em %)
       type: 'text' | 'icon' | 'shape' | 'image' | 'slot'
   Exposto como window.Canvas
     - Canvas.renderStatic(design, opts)  -> nó DOM (não interativo)
     - Canvas.open({design, aspect, title, allowSlots, onSave})
     - Canvas.blankDesign()
   ============================================================ */
(function () {
  'use strict';
  const { el, clear, toast, dropzone, readImage } = window.UI;
  const Store = window.Store;

  const FONTS = [
    { v: '"Space Grotesk", sans-serif', n: 'Space Grotesk' },
    { v: 'Inter, sans-serif', n: 'Inter' },
    { v: '"Cinzel", serif', n: 'Cinzel' },
    { v: '"Bebas Neue", sans-serif', n: 'Bebas Neue' },
    { v: '"Pacifico", cursive', n: 'Pacifico' },
    { v: '"Righteous", cursive', n: 'Righteous' },
    { v: 'Georgia, serif', n: 'Serif' },
    { v: '"Courier New", monospace', n: 'Mono' },
  ];

  function uid() { return 'el-' + Math.random().toString(36).slice(2, 8); }
  function blankDesign() {
    return { bg: { type: 'gradient', color1: '#6d28d9', color2: '#1e1b4b', angle: 150, color: '#111827', image: '' }, els: [] };
  }

  function bgStyle(bg) {
    if (!bg) return 'background:#111827';
    if (bg.type === 'image' && bg.image) return `background-image:url('${bg.image}');background-size:cover;background-position:center`;
    if (bg.type === 'solid') return `background:${bg.color}`;
    return `background:linear-gradient(${bg.angle || 150}deg, ${bg.color1}, ${bg.color2})`;
  }

  /* -------- element -> DOM (shared by editor & static) -------- */
  function elementNode(elm, ctx) {
    ctx = ctx || {};
    const node = el('div', { class: 'cv-el', dataset: { id: elm.id } });
    node.style.left = elm.x + '%';
    node.style.top = elm.y + '%';
    node.style.width = elm.w + '%';
    node.style.height = elm.h + '%';
    node.style.transform = `rotate(${elm.rot || 0}deg)`;
    node.style.opacity = (elm.opacity != null ? elm.opacity : 1);

    if (elm.type === 'text') {
      const t = el('div', { class: 'cv-text' }, elm.text || 'Texto');
      t.style.color = elm.color || '#fff';
      t.style.fontFamily = elm.font || FONTS[0].v;
      t.style.fontWeight = elm.weight || '700';
      t.style.fontSize = (elm.size || 6) + 'cqw';
      t.style.textAlign = elm.align || 'center';
      t.style.lineHeight = '1.1';
      if (elm.shadow) t.style.textShadow = '0 2px 8px rgba(0,0,0,.6)';
      node.appendChild(t);
    } else if (elm.type === 'icon') {
      const t = el('div', { class: 'cv-icon' }, elm.icon || '⭐');
      t.style.fontSize = (elm.size || 14) + 'cqw';
      node.appendChild(t);
    } else if (elm.type === 'shape') {
      const sh = el('div', { class: 'cv-shape' });
      sh.style.background = elm.fill || '#ffffff';
      sh.style.opacity = elm.fillOpacity != null ? elm.fillOpacity : 1;
      if (elm.shape === 'circle') sh.style.borderRadius = '50%';
      else if (elm.shape === 'line') { sh.style.height = (elm.thickness || 8) + 'px'; sh.style.alignSelf = 'center'; sh.style.marginTop = 'auto'; sh.style.marginBottom = 'auto'; }
      else sh.style.borderRadius = (elm.radius || 12) + 'px';
      if (elm.border) sh.style.border = `2px solid ${elm.borderColor || '#fff'}`;
      node.appendChild(sh);
    } else if (elm.type === 'image') {
      const im = el('div', { class: 'cv-image' });
      im.style.backgroundImage = `url('${elm.src || ''}')`;
      im.style.borderRadius = (elm.radius || 8) + 'px';
      if (elm.circle) im.style.borderRadius = '50%';
      node.appendChild(im);
    } else if (elm.type === 'slot') {
      // rendered by caller in static mode; placeholder in editor
      if (ctx.renderSlot) { node.appendChild(ctx.renderSlot(elm)); }
      else {
        node.appendChild(el('div', { class: 'cv-slot' }, [
          el('div', { class: 'text-[10px] opacity-70 text-center' }, '🃏 slot'),
        ]));
      }
    }
    return node;
  }

  /* ============================================================
     STATIC render (player & previews) — not interactive
     opts: { interactive:false, renderSlot:(elm)=>node, class }
     ============================================================ */
  function renderStatic(design, opts) {
    opts = opts || {};
    const stage = el('div', { class: 'cv-stage ' + (opts.class || '') });
    stage.setAttribute('style', bgStyle(design && design.bg) + ';container-type:size;');
    (design && design.els || []).forEach((elm) => stage.appendChild(elementNode(elm, opts)));
    return stage;
  }

  /* ============================================================
     OPEN editor (full-screen overlay)
     ============================================================ */
  function open(config) {
    const aspect = config.aspect || '3 / 4';
    // deep clone so cancel discards changes
    const design = JSON.parse(JSON.stringify(config.design || blankDesign()));
    let selectedId = null;
    let clipboard = null;

    const overlay = el('div', { class: 'cv-overlay' });

    /* --- top bar --- */
    const topbar = el('div', { class: 'cv-topbar glass' }, [
      el('div', { class: 'flex items-center gap-2 min-w-0' }, [
        el('button', { class: 'btn-secondary !px-3 !py-2 text-sm', onclick: cancel }, '✕'),
        el('span', { class: 'truncate font-display font-bold' }, config.title || 'Editor'),
      ]),
      el('div', { class: 'flex items-center gap-2' }, [
        el('button', { class: 'btn-secondary !px-3 !py-2 text-sm', onclick: () => bgPanel() }, '🎨 Fundo'),
        el('button', { class: 'btn-primary !px-4 !py-2 text-sm', onclick: done }, '✓ Salvar'),
      ]),
    ]);

    /* --- add toolbar --- */
    const addbar = el('div', { class: 'cv-addbar glass-soft' }, [
      addBtn('🔤', 'Texto', () => addText()),
      addBtn('😀', 'Emoji', () => emojiPicker()),
      addBtn('▭', 'Forma', () => shapePicker()),
      addBtn('🖼️', 'Imagem', () => addImage()),
      config.allowSlots ? addBtn('🃏', 'Slot', () => addSlot()) : null,
      addBtn('📋', 'Colar', () => paste()),
    ]);

    /* --- canvas stage --- */
    const stage = el('div', { class: 'cv-stage cv-edit' });
    stage.setAttribute('style', bgStyle(design.bg) + ';container-type:size;');
    const stageWrap = el('div', { class: 'cv-canvas-wrap' }, [stage]);
    stageWrap.style.aspectRatio = aspect;

    /* --- properties panel (bottom sheet) --- */
    const propPanel = el('div', { class: 'cv-props glass' });

    const center = el('div', { class: 'cv-center' }, [stageWrap]);
    overlay.appendChild(topbar);
    overlay.appendChild(addbar);
    overlay.appendChild(center);
    overlay.appendChild(propPanel);
    document.getElementById('modal-root').appendChild(overlay);

    /* ---------- rendering ---------- */
    let nodeMap = {};
    function renderStage() {
      clear(stage);
      nodeMap = {};
      stage.setAttribute('style', bgStyle(design.bg) + ';container-type:size;');
      design.els.forEach((elm) => {
        const node = elementNode(elm, {});
        node.classList.add('cv-el--edit');
        nodeMap[elm.id] = node;
        bindDrag(node, elm);
        if (elm.id === selectedId) { node.classList.add('cv-selected'); addHandles(node, elm); }
        stage.appendChild(node);
      });
    }
    /* rebuild stage after a structural change (add/remove/reorder) */
    function rebuild(newSelected) { if (newSelected !== undefined) selectedId = newSelected; renderStage(); renderProps(); }

    /* lightweight selection — does NOT rebuild the stage (so drag survives) */
    function select(id) {
      if (selectedId === id) { renderProps(); return; }
      const prev = nodeMap[selectedId];
      if (prev) { prev.classList.remove('cv-selected'); prev.querySelectorAll('.cv-handle').forEach((h) => h.remove()); }
      selectedId = id;
      const cur = nodeMap[id];
      const elm = design.els.find((x) => x.id === id);
      if (cur && elm) { cur.classList.add('cv-selected'); addHandles(cur, elm); }
      renderProps();
    }
    function deselectIfBlank(e) { if (e.target === stage) select(null); }
    stage.addEventListener('pointerdown', deselectIfBlank);

    /* ---------- drag & resize (pointer events) ---------- */
    function bindDrag(node, elm) {
      node.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.cv-handle')) return; // handled separately
        e.stopPropagation();
        e.preventDefault();
        select(elm.id); // lightweight — node persists, so drag keeps working
        const rect = stage.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY, ex = elm.x, ey = elm.y;
        try { node.setPointerCapture(e.pointerId); } catch (err) {}
        function move(ev) {
          const dx = ((ev.clientX - sx) / rect.width) * 100;
          const dy = ((ev.clientY - sy) / rect.height) * 100;
          elm.x = clamp(ex + dx, -10, 100 - 5);
          elm.y = clamp(ey + dy, -10, 100 - 5);
          node.style.left = elm.x + '%'; node.style.top = elm.y + '%';
        }
        function up() { try { node.releasePointerCapture(e.pointerId); } catch (err) {} node.removeEventListener('pointermove', move); node.removeEventListener('pointerup', up); node.removeEventListener('pointercancel', up); }
        node.addEventListener('pointermove', move);
        node.addEventListener('pointerup', up);
        node.addEventListener('pointercancel', up);
      });
    }

    function addHandles(node, elm) {
      // resize (bottom-right)
      const rh = el('div', { class: 'cv-handle cv-handle--resize', title: 'Redimensionar' }, '⤡');
      rh.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const rect = stage.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY, ew = elm.w, eh = elm.h;
        try { rh.setPointerCapture(e.pointerId); } catch (err) {}
        function move(ev) {
          const dw = ((ev.clientX - sx) / rect.width) * 100;
          const dh = ((ev.clientY - sy) / rect.height) * 100;
          elm.w = clamp(ew + dw, 5, 130);
          elm.h = clamp(eh + dh, 5, 130);
          node.style.width = elm.w + '%'; node.style.height = elm.h + '%';
        }
        function up() { try { rh.releasePointerCapture(e.pointerId); } catch (err) {} rh.removeEventListener('pointermove', move); rh.removeEventListener('pointerup', up); rh.removeEventListener('pointercancel', up); }
        rh.addEventListener('pointermove', move); rh.addEventListener('pointerup', up); rh.addEventListener('pointercancel', up);
      });
      // delete (top-right) — use pointerup so it also fires reliably on touch
      const dl = el('div', { class: 'cv-handle cv-handle--del', title: 'Excluir' }, '×');
      dl.addEventListener('pointerup', (e) => { e.stopPropagation(); e.preventDefault(); removeEl(elm.id); });
      node.appendChild(rh); node.appendChild(dl);
    }

    /* ---------- element ops ---------- */
    function addEl(elm) { design.els.push(elm); rebuild(elm.id); }
    function removeEl(id) { design.els = design.els.filter((x) => x.id !== id); rebuild(selectedId === id ? null : selectedId); toast('Elemento removido', 'info'); }
    function duplicateEl(elm) { const c = JSON.parse(JSON.stringify(elm)); c.id = uid(); c.x = clamp(c.x + 5, 0, 90); c.y = clamp(c.y + 5, 0, 90); addEl(c); }
    function layer(elm, dir) {
      const i = design.els.indexOf(elm); if (i < 0) return;
      const j = i + dir; if (j < 0 || j >= design.els.length) return;
      design.els.splice(i, 1); design.els.splice(j, 0, elm); rebuild(selectedId);
    }

    /* copy / paste elements (keeps the same size — handy for uniform slots) */
    function copyEl(elm) { clipboard = JSON.parse(JSON.stringify(elm)); delete clipboard.id; delete clipboard.slotId; toast('Elemento copiado — toque em 📋 Colar', 'info'); }
    function paste() {
      if (!clipboard) { toast('Nada copiado ainda. Selecione um elemento e toque em 📄 Copiar.', 'info'); return; }
      const c = JSON.parse(JSON.stringify(clipboard));
      c.id = uid();
      if (c.type === 'slot') c.slotId = Store.uid('slot');
      c.x = clamp((c.x || 10) + 5, 0, 92);
      c.y = clamp((c.y || 10) + 5, 0, 92);
      addEl(c);
    }
    /* make every slot the same size as the given one */
    function equalizeSlots(elm) {
      const n = design.els.filter((e) => e.type === 'slot').length;
      design.els.forEach((e) => { if (e.type === 'slot') { e.w = elm.w; e.h = elm.h; } });
      rebuild(selectedId);
      toast(`${n} slots com o mesmo tamanho ✓`, 'success');
    }

    function addText() { addEl({ id: uid(), type: 'text', x: 25, y: 40, w: 50, h: 14, rot: 0, text: 'Seu texto', color: '#ffffff', font: FONTS[0].v, weight: '700', size: 8, align: 'center', shadow: true }); }
    function addSlot() { addEl({ id: uid(), type: 'slot', x: 38, y: 36, w: 24, h: 28, rot: 0, slotId: Store.uid('slot') }); }
    function addShapeKind(kind) { addEl({ id: uid(), type: 'shape', shape: kind, x: 35, y: 35, w: 30, h: 30, rot: 0, fill: '#f472b6', fillOpacity: 1, radius: 14, thickness: 8 }); }
    function addIcon(icon) { addEl({ id: uid(), type: 'icon', x: 40, y: 38, w: 20, h: 20, rot: 0, icon: icon, size: 16 }); }
    async function addImage() {
      pickFile(async (file) => { try { const src = await readImage(file); addEl({ id: uid(), type: 'image', x: 28, y: 28, w: 44, h: 44, rot: 0, src: src, radius: 10 }); } catch (e) { toast('Imagem inválida', 'error'); } });
    }

    /* ---------- pickers ---------- */
    function emojiPicker() {
      const emojis = '⭐🏆🔥👑💎⚽🥅🧤🦁🐍🚀✨🎯💥🌟⚡🛡️🎖️🏅📣🎉💫🔱'.match(/./gu);
      sheet('Escolha um emoji', el('div', { class: 'grid grid-cols-6 gap-2' },
        emojis.map((em) => el('button', { class: 'ghost-btn !h-11 !w-full text-xl', onclick: () => { closeSheet(); addIcon(em); } }, em))));
    }
    function shapePicker() {
      sheet('Adicionar forma', el('div', { class: 'grid grid-cols-3 gap-3' }, [
        shapeOpt('▭', 'Retângulo', 'rect'), shapeOpt('⬤', 'Círculo', 'circle'), shapeOpt('▬', 'Linha', 'line'),
      ]));
    }
    function shapeOpt(icon, label, kind) {
      return el('button', { class: 'btn-secondary flex-col !py-4', onclick: () => { closeSheet(); addShapeKind(kind); } }, [el('div', { class: 'text-2xl' }, icon), el('div', { class: 'text-xs' }, label)]);
    }

    /* ---------- background panel ---------- */
    function bgPanel() {
      const body = el('div', { class: 'space-y-3' });
      const typeRow = el('div', { class: 'grid grid-cols-3 gap-2' }, [
        bgTypeBtn('gradient', 'Gradiente'), bgTypeBtn('solid', 'Cor'), bgTypeBtn('image', 'Imagem'),
      ]);
      body.appendChild(typeRow);
      const dyn = el('div', { class: 'space-y-3' });
      body.appendChild(dyn);
      function renderDyn() {
        clear(dyn);
        if (design.bg.type === 'gradient') {
          dyn.appendChild(field2('Cor 1', colorIn(design.bg.color1, (v) => { design.bg.color1 = v; refreshBg(); }), 'Cor 2', colorIn(design.bg.color2, (v) => { design.bg.color2 = v; refreshBg(); })));
          dyn.appendChild(labeledRange('Ângulo', design.bg.angle, 0, 360, (v) => { design.bg.angle = v; refreshBg(); }));
        } else if (design.bg.type === 'solid') {
          dyn.appendChild(field('Cor', colorIn(design.bg.color, (v) => { design.bg.color = v; refreshBg(); })));
        } else {
          if (design.bg.image) {
            dyn.appendChild(el('div', { class: 'relative' }, [el('img', { src: design.bg.image, class: 'h-28 w-full rounded-xl object-cover' }), el('button', { class: 'absolute right-2 top-2 ghost-btn !h-8 !w-8', onclick: () => { design.bg.image = ''; renderDyn(); refreshBg(); } }, '×')]));
          } else {
            dyn.appendChild(dropzone({ label: 'Fundo da ' + (config.allowSlots ? 'página' : 'figurinha'), onImage: (url) => { design.bg.image = url; renderDyn(); refreshBg(); } }));
          }
        }
      }
      function refreshBg() { stage.setAttribute('style', bgStyle(design.bg) + ';container-type:size;'); typeRow.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.t === design.bg.type)); }
      renderDyn();
      sheet('🎨 Fundo', body);
      refreshBg();
      function bgTypeBtn(t, label) { return el('button', { class: 'nav-tab ' + (design.bg.type === t ? 'active' : ''), dataset: { t }, onclick: () => { design.bg.type = t; renderDyn(); refreshBg(); } }, label); }
    }

    /* ---------- properties for selected element ---------- */
    function renderProps() {
      clear(propPanel);
      const elm = design.els.find((x) => x.id === selectedId);
      if (!elm) {
        propPanel.appendChild(el('p', { class: 'text-center text-xs text-slate-400 py-2' }, '👆 Toque em um elemento para editar — ou adicione um acima.'));
        return;
      }
      const head = el('div', { class: 'mb-2 flex items-center justify-between' }, [
        el('span', { class: 'text-xs font-semibold uppercase tracking-wide text-slate-400' }, typeLabel(elm.type)),
        el('div', { class: 'flex gap-1' }, [
          iconBtn('⬇️', 'Para trás', () => layer(elm, -1)),
          iconBtn('⬆️', 'Para frente', () => layer(elm, 1)),
          iconBtn('📄', 'Copiar', () => copyEl(elm)),
          iconBtn('⧉', 'Duplicar', () => duplicateEl(elm)),
          iconBtn('🗑', 'Excluir', () => removeEl(elm.id)),
        ]),
      ]);
      propPanel.appendChild(head);

      const ctrls = el('div', { class: 'cv-props-grid' });
      if (elm.type === 'text') {
        const ta = el('textarea', { class: 'field col-span-2', rows: '2' }); ta.value = elm.text; ta.addEventListener('input', (e) => { elm.text = e.target.value; renderStage(); });
        ctrls.appendChild(wrap2('Texto', ta));
        ctrls.appendChild(field('Cor', colorIn(elm.color, (v) => { elm.color = v; renderStage(); })));
        ctrls.appendChild(field('Fonte', selectIn(FONTS.map((f) => [f.v, f.n]), elm.font, (v) => { elm.font = v; renderStage(); })));
        ctrls.appendChild(wrap2('Tamanho', range(elm.size, 3, 30, (v) => { elm.size = v; renderStage(); })));
        ctrls.appendChild(field('Alinhar', selectIn([['center', 'Centro'], ['left', 'Esquerda'], ['right', 'Direita']], elm.align, (v) => { elm.align = v; renderStage(); })));
        ctrls.appendChild(field('Peso', selectIn([['400', 'Normal'], ['700', 'Negrito'], ['900', 'Black']], elm.weight, (v) => { elm.weight = v; renderStage(); })));
      } else if (elm.type === 'icon') {
        ctrls.appendChild(wrap2('Tamanho', range(elm.size, 4, 40, (v) => { elm.size = v; renderStage(); })));
      } else if (elm.type === 'shape') {
        ctrls.appendChild(field('Cor', colorIn(elm.fill, (v) => { elm.fill = v; renderStage(); })));
        ctrls.appendChild(wrap2('Opacidade', range((elm.fillOpacity ?? 1) * 100, 0, 100, (v) => { elm.fillOpacity = v / 100; renderStage(); })));
        if (elm.shape === 'rect') ctrls.appendChild(wrap2('Cantos', range(elm.radius, 0, 60, (v) => { elm.radius = v; renderStage(); })));
      } else if (elm.type === 'image') {
        ctrls.appendChild(wrap2('Cantos', range(elm.radius, 0, 50, (v) => { elm.radius = v; renderStage(); })));
        ctrls.appendChild(field('Formato', selectIn([['0', 'Quadrado'], ['1', 'Círculo']], elm.circle ? '1' : '0', (v) => { elm.circle = v === '1'; renderStage(); })));
      } else if (elm.type === 'slot') {
        ctrls.appendChild(el('button', { class: 'btn-secondary col-span-2 !py-2 text-sm', onclick: () => equalizeSlots(elm) }, '↔ Igualar tamanho de todos os slots'));
        ctrls.appendChild(el('p', { class: 'col-span-2 text-xs text-slate-400' }, 'Dica: ajuste este slot, toque em “Igualar” para todos ficarem iguais — ou use 📄 Copiar e 📋 Colar para criar slots idênticos.'));
      }
      // common: rotation + opacity
      ctrls.appendChild(wrap2('Rotação', range(elm.rot || 0, -180, 180, (v) => { elm.rot = v; renderStage(); })));
      propPanel.appendChild(ctrls);
    }

    /* ---------- sheets ---------- */
    let sheetEl = null;
    function sheet(title, body) {
      closeSheet();
      sheetEl = el('div', { class: 'cv-sheet glass view-in' }, [
        el('div', { class: 'mb-3 flex items-center justify-between' }, [el('h4', { class: 'font-display font-bold' }, title), el('button', { class: 'ghost-btn', onclick: closeSheet }, '×')]),
        body,
      ]);
      overlay.appendChild(sheetEl);
    }
    function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }

    function done() { overlay.remove(); config.onSave && config.onSave(design); }
    function cancel() { overlay.remove(); }

    renderStage();
    renderProps();
  }

  /* ---------- small builders ---------- */
  function addBtn(icon, label, onClick) { return el('button', { class: 'cv-add', onclick: onClick }, [el('span', { class: 'text-lg' }, icon), el('span', { class: 'text-[10px]' }, label)]); }
  function iconBtn(icon, title, onClick) { return el('button', { class: 'ghost-btn !h-8 !w-8 text-sm', title, onclick: onClick }, icon); }
  function typeLabel(t) { return ({ text: 'Texto', icon: 'Emoji', shape: 'Forma', image: 'Imagem', slot: 'Slot' })[t] || t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function pickFile(cb) { const i = el('input', { type: 'file', accept: 'image/*', class: 'hidden' }); document.body.appendChild(i); i.addEventListener('change', () => { if (i.files[0]) cb(i.files[0]); i.remove(); }); i.click(); }

  function field(label, control) { return el('div', {}, [el('label', { class: 'field-label' }, label), control]); }
  function wrap2(label, control) { return el('div', { class: 'col-span-2' }, [el('label', { class: 'field-label' }, label), control]); }
  function field2(l1, c1, l2, c2) { return el('div', { class: 'grid grid-cols-2 gap-2 col-span-2' }, [field(l1, c1), field(l2, c2)]); }
  function colorIn(value, onChange) { const n = el('input', { type: 'color', value: value || '#ffffff', class: 'h-9 w-full rounded-lg bg-transparent' }); n.addEventListener('input', (e) => onChange(e.target.value)); return n; }
  function range(value, min, max, onChange) { const n = el('input', { type: 'range', min: String(min), max: String(max), value: String(value), class: 'w-full accent-fuchsia-500' }); n.addEventListener('input', (e) => onChange(parseFloat(e.target.value))); return n; }
  function labeledRange(label, value, min, max, onChange) { return el('div', { class: 'col-span-2' }, [el('label', { class: 'field-label' }, label), range(value, min, max, onChange)]); }
  function selectIn(options, value, onChange) {
    const n = el('select', { class: 'field' });
    options.forEach(([v, label]) => { const o = el('option', { value: v }, label); if (String(v) === String(value)) o.selected = true; n.appendChild(o); });
    n.addEventListener('change', (e) => onChange(e.target.value));
    return n;
  }

  window.Canvas = { renderStatic, open, blankDesign, bgStyle };
})();


/* ===== js/stickers.js ===== */
/* ============================================================
   stickers.js — render a sticker card from its definition
   Exposed as window.Stickers
   ============================================================ */
(function () {
  'use strict';
  const { el } = window.UI;
  const { RARITIES } = window.Store;

  /* Render a single sticker card element.
     opts: { showStats:true, small:false } */
  function render(sticker, opts) {
    opts = opts || {};
    const rar = RARITIES[sticker.type] || RARITIES.normal;

    // Custom Canva design takes over the card face (frame/holo/badges stay)
    if (sticker.design && sticker.design.els && window.Canvas) {
      return renderCustom(sticker, rar);
    }

    const photo = sticker.photo
      ? el('div', { class: 'sticker__photo', style: `background-image:url('${sticker.photo}')` })
      : el('div', { class: 'sticker__photo sticker__photo--empty' }, initials(sticker.name));

    const layers = [];
    // custom background color (behind everything)
    if (sticker.bgColor) layers.push(el('div', { class: 'sticker__bg', style: bgFill(sticker.bgColor) }));
    layers.push(photo);
    layers.push(el('div', { class: 'sticker__overlay' }));

    // Holographic layers for shiny + legend
    if (sticker.type === 'shiny') {
      layers.push(el('div', { class: 'sticker__holo' }));
      layers.push(el('div', { class: 'sticker__holo2' }));
    }
    if (sticker.type === 'legend') {
      layers.push(el('div', { class: 'sticker__holo' }));
      layers.push(el('div', { class: 'sticker__crown' }, '👑'));
    }

    // Number badge
    if (sticker.number != null) layers.push(el('div', { class: 'sticker__num' }, '#' + sticker.number));
    // Rarity badge
    layers.push(el('div', { class: 'sticker__badge' }, rar.badge));

    // Name + team (+ country flag)
    layers.push(el('div', { class: 'sticker__name' }, sticker.name || 'Sem nome'));
    const flag = sticker.country && window.Countries ? window.Countries.flag(sticker.country) : '';
    if (sticker.team || flag) {
      const teamText = sticker.team || (window.Countries ? window.Countries.name(sticker.country) : '');
      layers.push(el('div', { class: 'sticker__team' }, (flag ? flag + ' ' : '') + teamText));
    }

    // Stats
    if (opts.showStats !== false && (sticker.height || sticker.weight || sticker.dob)) {
      const stats = [];
      if (sticker.height) stats.push(el('span', {}, '📏 ' + sticker.height));
      if (sticker.weight) stats.push(el('span', {}, '⚖ ' + sticker.weight));
      if (stats.length) layers.push(el('div', { class: 'sticker__stats' }, stats));
    }

    const card = el('div', { class: cardClass(sticker) }, layers);
    if (opts.onClick) card.addEventListener('click', opts.onClick);
    return card;
  }

  /* background fill: solid color or "c1|c2" gradient */
  function bgFill(v) {
    if (v && v.indexOf('|') >= 0) { const [a, b] = v.split('|'); return `background:linear-gradient(155deg, ${a}, ${b})`; }
    return `background:${v}`;
  }

  /* compose the card classes: rarity + free shape */
  function cardClass(sticker) {
    const shape = sticker.shape || (sticker.type === 'escudo' ? 'shield' : 'rect');
    return 'sticker sticker--' + (sticker.type || 'normal') + ' shape--' + shape;
  }

  /* render a sticker whose face is a custom Canva design */
  function renderCustom(sticker, rar) {
    const face = window.Canvas.renderStatic(sticker.design, {});
    face.classList.add('sticker__customface');
    const layers = [face];
    if (sticker.type === 'shiny') { layers.push(el('div', { class: 'sticker__holo' })); layers.push(el('div', { class: 'sticker__holo2' })); }
    if (sticker.type === 'legend') { layers.push(el('div', { class: 'sticker__holo' })); layers.push(el('div', { class: 'sticker__crown' }, '👑')); }
    if (sticker.number != null) layers.push(el('div', { class: 'sticker__num' }, '#' + sticker.number));
    layers.push(el('div', { class: 'sticker__badge' }, rar.badge));
    if (sticker.country && window.Countries) layers.push(el('div', { class: 'sticker__team' }, window.Countries.flag(sticker.country)));
    return el('div', { class: cardClass(sticker) }, layers);
  }

  function initials(name) {
    if (!name) return '?';
    return name.split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase() || '?';
  }

  /* Detailed front/back flip view used in modals (player card details) */
  function detailCard(sticker) {
    const wrap = el('div', { class: 'mx-auto w-56' });
    wrap.appendChild(render(sticker, { showStats: true }));
    window.UI.bindHolo(wrap);
    const info = el('div', { class: 'mt-4 space-y-1 text-sm text-slate-300' }, [
      sticker.team ? row('Time', sticker.team) : null,
      sticker.country && window.Countries ? row('País', window.Countries.label(sticker.country)) : null,
      sticker.dob ? row('Nascimento', formatDate(sticker.dob)) : null,
      sticker.height ? row('Altura', sticker.height) : null,
      sticker.weight ? row('Peso', sticker.weight) : null,
      row('Raridade', (RARITIES[sticker.type] || RARITIES.normal).label),
    ]);
    wrap.appendChild(info);
    return wrap;
  }
  function row(k, v) {
    return el('div', { class: 'flex justify-between border-b border-white/10 py-1' }, [
      el('span', { class: 'text-slate-400' }, k),
      el('span', { class: 'font-semibold' }, v),
    ]);
  }
  function formatDate(d) {
    try { return new Date(d).toLocaleDateString('pt-BR'); } catch (e) { return d; }
  }

  window.Stickers = { render, detailCard, initials };
})();


/* ===== js/editor.js ===== */
/* ============================================================
   editor.js — MODO EDITOR
   Tabs: Álbum (capa/contracapa/páginas/tema) · Figurinhas · Pacote
   Exposed as window.Editor.render(container)
   ============================================================ */
(function () {
  'use strict';
  const { el, clear, toast, modal, confirm, dropzone } = window.UI;
  const Store = window.Store;
  const { RARITIES, THEMES } = Store;

  let activeTab = 'album';

  function render(container) {
    const s = Store.get();
    clear(container);

    const header = el('div', { class: 'mb-6 flex flex-wrap items-center justify-between gap-4 view-in' }, [
      el('div', {}, [
        el('h1', { class: 'font-display text-2xl font-bold sm:text-3xl' }, '🎨 Modo Editor'),
        el('p', { class: 'text-sm text-slate-400' }, 'Desenhe o álbum, crie figurinhas e configure os pacotinhos.'),
      ]),
      el('div', { class: 'glass-soft flex gap-1 rounded-xl p-1' }, [
        tabBtn('album', '📔 Álbum'),
        tabBtn('stickers', '🃏 Figurinhas'),
        tabBtn('pack', '📦 Pacote'),
      ]),
    ]);
    container.appendChild(header);

    const body = el('div', { class: 'view-in' });
    container.appendChild(body);

    if (activeTab === 'album') renderAlbumTab(body, s);
    else if (activeTab === 'stickers') renderStickersTab(body, s);
    else renderPackTab(body, s);
  }

  function tabBtn(id, label) {
    return el('button', {
      class: 'nav-tab ' + (activeTab === id ? 'active' : ''),
      onclick: () => { activeTab = id; window.App.rerender(); },
    }, label);
  }

  /* ============================================================
     TAB: ÁLBUM
     ============================================================ */
  function renderAlbumTab(body, s) {
    const grid = el('div', { class: 'grid gap-6 lg:grid-cols-3' });

    /* --- settings column --- */
    const settings = el('div', { class: 'space-y-6 lg:col-span-1' });

    // General
    settings.appendChild(panel('Configurações Gerais', [
      labeled('Título do álbum', input(s.album.title, (v) => Store.update((st) => { st.album.title = v; }, { silent: true }))),
      labeled('Paleta de cores', themePicker(s)),
    ]));

    // Cover
    settings.appendChild(panel('Capa', [
      labeled('Título da capa', input(s.album.cover.title, (v) => Store.update((st) => { st.album.cover.title = v; }))),
      labeled('Subtítulo', input(s.album.cover.subtitle, (v) => Store.update((st) => { st.album.cover.subtitle = v; }))),
      imageField('Imagem de fundo da capa', s.album.cover.image,
        (url) => { Store.update((st) => { st.album.cover.image = url; }); window.App.rerender(); },
        () => { Store.update((st) => { st.album.cover.image = ''; }); window.App.rerender(); }),
    ]));

    // Back cover
    settings.appendChild(panel('Contracapa', [
      labeled('Texto da contracapa', textarea(s.album.backCover.text, (v) => Store.update((st) => { st.album.backCover.text = v; }))),
      imageField('Imagem de fundo da contracapa', s.album.backCover.image,
        (url) => { Store.update((st) => { st.album.backCover.image = url; }); window.App.rerender(); },
        () => { Store.update((st) => { st.album.backCover.image = ''; }); window.App.rerender(); }),
    ]));

    grid.appendChild(settings);

    /* --- preview + pages column --- */
    const right = el('div', { class: 'space-y-6 lg:col-span-2' });

    // Cover / back previews
    right.appendChild(panel('Pré-visualização', [
      el('div', { class: 'grid gap-4 sm:grid-cols-2' }, [
        coverPreview(s.album.cover, 'front'),
        coverPreview({ title: 'CONTRACAPA', subtitle: s.album.backCover.text, image: s.album.backCover.image }, 'back'),
      ]),
    ]));

    // Pages manager
    const pagesPanel = panel('Páginas & Slots', []);
    const pagesHead = el('div', { class: 'mb-4 flex flex-wrap items-center justify-between gap-2' }, [
      el('p', { class: 'text-sm text-slate-400' }, `${s.album.pages.length} páginas · ${Store.totalSlots()} slots no total`),
      el('div', { class: 'flex gap-2' }, [
        el('button', { class: 'btn-secondary text-sm', onclick: autoFillSlots }, '✨ Preencher tudo'),
        el('button', { class: 'btn-primary text-sm', onclick: addPage }, '＋ Nova página'),
      ]),
    ]);
    pagesPanel.appendChild(pagesHead);

    const pagesWrap = el('div', { class: 'space-y-5' });
    s.album.pages.forEach((page, idx) => pagesWrap.appendChild(pageEditor(page, idx, s)));
    pagesPanel.appendChild(pagesWrap);
    right.appendChild(pagesPanel);

    grid.appendChild(right);
    body.appendChild(grid);
  }

  function themePicker(s) {
    const labels = { dark: '🌙 Dark', light: '☀️ Light', neon: '🔮 Neon', vintage: '📜 Vintage' };
    return el('div', { class: 'grid grid-cols-2 gap-2' }, THEMES.map((t) =>
      el('button', {
        class: 'btn-secondary text-sm ' + (s.album.theme === t ? '!border-fuchsia-400 ring-2 ring-fuchsia-400/40' : ''),
        onclick: () => { Store.update((st) => { st.album.theme = t; }); window.App.applyTheme(); },
      }, labels[t])
    ));
  }

  function coverPreview(cover, side) {
    const inner = el('div', {
      class: 'relative flex h-full flex-col items-center justify-center gap-2 rounded-2xl border-2 border-white/20 p-6 text-center',
      style: cover.image
        ? `background-image:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)),url('${cover.image}');background-size:cover;background-position:center;`
        : 'background:linear-gradient(150deg,var(--accent),var(--accent-2));',
    }, [
      el('div', { class: 'text-3xl animate-floaty' }, side === 'front' ? '⚽' : '📖'),
      el('h3', { class: 'font-display text-xl font-bold leading-tight drop-shadow' }, cover.title || '—'),
      el('p', { class: 'text-xs text-white/80' }, cover.subtitle || ''),
    ]);
    return el('div', { class: 'aspect-[3/4] overflow-hidden rounded-2xl shadow-2xl' }, inner);
  }

  function pageEditor(page, idx, s) {
    const isFree = page.layout === 'free' && page.design;

    const head = el('div', { class: 'mb-3 flex flex-wrap items-center justify-between gap-2' }, [
      el('h4', { class: 'font-display font-semibold' }, `Página ${idx + 1}`),
      el('div', { class: 'flex items-center gap-2' }, [
        el('button', { class: 'btn-secondary !px-3 !py-1.5 text-xs', title: 'Editor livre estilo Canva', onclick: () => openPageDesigner(page) }, '✨ Personalizar'),
        !isFree ? el('button', { class: 'ghost-btn', title: 'Remover slot', onclick: () => changeSlots(page.id, -1) }, '－') : null,
        !isFree ? el('span', { class: 'text-xs text-slate-400' }, page.slots.length + ' slots') : null,
        !isFree ? el('button', { class: 'ghost-btn', title: 'Adicionar slot', onclick: () => changeSlots(page.id, 1) }, '＋') : null,
        el('button', { class: 'ghost-btn !text-rose-300', title: 'Excluir página', onclick: () => removePage(page.id) }, '🗑'),
      ]),
    ]);

    let bodyNode;
    if (isFree) {
      const stage = window.Canvas.renderStatic(page.design, {
        renderSlot: (elm) => editorFreeSlot(elm, page),
      });
      const wrap = el('div', { class: 'relative mx-auto', style: 'aspect-ratio:3/4;max-width:340px' }, [stage,
        el('button', { class: 'btn-primary absolute bottom-2 right-2 !px-3 !py-1.5 text-xs', onclick: () => openPageDesigner(page) }, '✏ Editar design'),
      ]);
      window.UI.bindHolo(wrap);
      bodyNode = el('div', {}, [
        el('p', { class: 'mb-2 text-center text-xs text-slate-400' }, 'A cor/fundo desta página é editada no Canva (✨ Personalizar → 🎨 Fundo). Toque num slot 🃏 para vincular a figurinha.'),
        wrap,
      ]);
    } else {
      bodyNode = el('div', {}, [
        pageColorControl(page),
        el('div', { class: 'grid grid-cols-3 gap-2 sm:grid-cols-6' }, page.slots.map((slot) => slotPreview(slot))),
      ]);
    }
    const card = el('div', { class: 'glass-soft rounded-xl p-4 page-in' }, [head, bodyNode]);
    if (!isFree && page.bg) card.setAttribute('style', pageBgStyle(page.bg));
    return card;
  }

  /* page background as solid color or "c1|c2" gradient */
  function pageBgStyle(v) {
    if (!v) return '';
    if (v.indexOf('|') >= 0) { const [a, b] = v.split('|'); return `background:linear-gradient(160deg, ${a}, ${b})`; }
    return `background:${v}`;
  }

  /* compact color control for a (grid) page background */
  function pageColorControl(page) {
    const SWATCHES = ['#0f172a', '#1e293b', '#312e81', '#5b21b6', '#831843', '#7f1d1d', '#064e3b', '#155e75', '#92400e', '#f8fafc'];
    const GRADIENTS = [['#7c3aed', '#2563eb'], ['#db2777', '#f97316'], ['#0ea5e9', '#1e3a8a'], ['#16a34a', '#064e3b'], ['#f59e0b', '#b45309']];
    const setBg = (v) => { Store.update((st) => { const p = st.album.pages.find((x) => x.id === page.id); if (p) p.bg = v; }); window.App.rerender(); };
    const wheel = el('input', { type: 'color', value: (page.bg && page.bg.indexOf('|') < 0) ? page.bg : '#1e293b', class: 'h-7 w-9 flex-shrink-0 rounded bg-transparent' });
    wheel.addEventListener('input', (e) => { Store.update((st) => { const p = st.album.pages.find((x) => x.id === page.id); if (p) p.bg = e.target.value; }, { silent: true }); });
    wheel.addEventListener('change', () => window.App.rerender());
    return el('div', { class: 'mb-3 flex flex-wrap items-center gap-1.5' }, [
      el('span', { class: 'mr-1 text-[11px] uppercase tracking-wide text-slate-400' }, '🎨 Cor da página'),
      wheel,
      ...SWATCHES.map((c) => el('button', { class: 'h-6 w-6 rounded border border-white/20', style: `background:${c}`, title: c, onclick: () => setBg(c) })),
      ...GRADIENTS.map(([a, b]) => el('button', { class: 'h-6 w-8 rounded border border-white/20', style: `background:linear-gradient(160deg,${a},${b})`, onclick: () => setBg(a + '|' + b) })),
      el('button', { class: 'ghost-btn !h-6 !w-6 text-xs', title: 'Sem cor', onclick: () => setBg('') }, '↺'),
    ]);
  }

  /* slot node inside the free (Canva) page preview — used to link a sticker */
  function editorFreeSlot(elm, page) {
    const slot = page.slots.find((sl) => sl.id === elm.slotId);
    const sticker = slot && slot.stickerId ? Store.stickerById(slot.stickerId) : null;
    if (sticker) {
      const node = window.Stickers.render(sticker, { showStats: false });
      const wrap = el('div', { class: 'relative h-full w-full' }, [node,
        el('button', { class: 'absolute -right-1 -top-1 z-20 grid h-5 w-5 place-items-center rounded-full bg-rose-500 text-xs',
          onclick: (e) => { e.stopPropagation(); Store.update((st) => { const sl = findSlot(st, elm.slotId); if (sl) sl.stickerId = null; }); window.App.rerender(); } }, '×'),
      ]);
      return wrap;
    }
    return el('div', { class: 'cv-slot cursor-pointer', onclick: () => assignStickerToSlot(elm.slotId) }, [
      el('div', { class: 'text-center text-[10px] opacity-80' }, '＋ vincular'),
    ]);
  }

  /* open the Canva-like designer for a page */
  function openPageDesigner(page) {
    let design = page.design;
    if (!design) {
      // seed from current grid slots, laid out in a grid of slot elements
      design = window.Canvas.blankDesign();
      design.els.push({ id: Store.uid('el'), type: 'text', x: 8, y: 4, w: 84, h: 12, rot: 0, text: `Página`, color: '#ffffff', font: '"Space Grotesk", sans-serif', weight: '700', size: 9, align: 'center', shadow: true });
      const n = page.slots.length || 6;
      const cols = n <= 4 ? 2 : 3;
      const rows = Math.ceil(n / cols);
      const cw = 84 / cols, ch = Math.min(26, (78) / rows);
      page.slots.forEach((sl, i) => {
        const r = Math.floor(i / cols), c = i % cols;
        design.els.push({ id: Store.uid('el'), type: 'slot', slotId: sl.id,
          x: 8 + c * cw + cw * 0.08, y: 18 + r * (ch + 2), w: cw * 0.84, h: ch, rot: 0 });
      });
    }
    window.Canvas.open({
      design, aspect: '3 / 4', title: 'Personalizar página', allowSlots: true,
      onSave: (d) => {
        Store.update((st) => {
          const p = st.album.pages.find((x) => x.id === page.id); if (!p) return;
          p.design = d; p.layout = 'free';
          reconcilePageSlots(p, d);
        });
        toast('Página atualizada ✨', 'success');
        window.App.rerender();
      },
    });
  }

  /* keep page.slots in sync with slot elements present in the design */
  function reconcilePageSlots(page, design) {
    const slotEls = design.els.filter((e) => e.type === 'slot');
    const ids = new Set(slotEls.map((e) => e.slotId));
    // add missing
    slotEls.forEach((e) => {
      if (!page.slots.find((sl) => sl.id === e.slotId)) page.slots.push({ id: e.slotId, stickerId: null });
    });
    // remove orphan slots no longer in design
    page.slots = page.slots.filter((sl) => ids.has(sl.id));
    if (!page.slots.length) page.slots.push(Store.makeSlot());
  }

  function slotPreview(slot) {
    const s = Store.get();
    const sticker = slot.stickerId ? Store.stickerById(slot.stickerId) : null;
    if (sticker) {
      return el('div', { class: 'relative' }, [
        window.Stickers.render(sticker, { showStats: false }),

          class: 'absolute -right-1 -top-1 grid h-5 w-5 place-items-center rounded-full bg-rose-500 text-xs',
          title: 'Desvincular',
          onclick: () => { Store.update((st) => { const sl = findSlot(st, slot.id); if (sl) sl.stickerId = null; }); window.App.rerender(); },

    return el('div', { class: 'slot', onclick: () => assignStickerToSlot(slot.id) }, [

  function findSlot(st, slotId) {
    for (const p of st.album.pages) { const sl = p.slots.find((x) => x.id === slotId); if (sl) return sl; }
    return null;
  }

  /* Pick which sticker definition this slot expects (the album checklist) */
  /* Auto-link every not-yet-linked sticker to an empty slot, adding pages if needed */
  function autoFillSlots() {
    const s = Store.get();
    if (!s.stickers.length) { toast('Crie figurinhas primeiro na aba 🃏', 'info'); activeTab = 'stickers'; window.App.rerender(); return; }
    const linked = new Set(s.album.pages.flatMap((p) => p.slots.map((sl) => sl.stickerId).filter(Boolean)));
    const pending = s.stickers.filter((st) => !linked.has(st.id));
    if (!pending.length) { toast('Todas as figurinhas já estão vinculadas ✓', 'info'); return; }

    confirm(`Vincular automaticamente ${pending.length} figurinha(s) aos slots vazios? Páginas serão criadas se faltar espaço.`, () => {
      Store.update((st) => {
        const queue = pending.slice();
        // fill existing empty slots first (in page/slot order)
        for (const p of st.album.pages) {
          for (const sl of p.slots) {
            if (!queue.length) break;
            if (!sl.stickerId) sl.stickerId = queue.shift().id;
          }
          if (!queue.length) break;
        }
        // create new grid pages for the rest
        while (queue.length) {
          const page = Store.makePage(6);
          for (const sl of page.slots) { if (!queue.length) break; sl.stickerId = queue.shift().id; }
          st.album.pages.push(page);
        }
      });
      toast(`${pending.length} figurinha(s) vinculada(s) ✓`, 'success');
      window.App.rerender();
    }, { yes: 'Preencher' });
  }

  function assignStickerToSlot(slotId) {
    const s = Store.get();
    if (!s.stickers.length) { toast('Crie figurinhas primeiro na aba 🃏', 'info'); activeTab = 'stickers'; window.App.rerender(); return; }
    const used = new Set(s.album.pages.flatMap((p) => p.slots.map((sl) => sl.stickerId).filter(Boolean)));
    const list = el('div', { class: 'grid max-h-[55vh] grid-cols-3 gap-3 overflow-y-auto p-1 sm:grid-cols-4' });
    const m = modal([
      el('h3', { class: 'mb-1 font-display text-lg font-bold' }, 'Vincular figurinha ao slot'),
      el('p', { class: 'mb-4 text-sm text-slate-400' }, 'Escolha qual figurinha pertence a este espaço do álbum.'),
      list,
    ], { size: 'max-w-2xl' });
    s.stickers.forEach((st) => {
      const card = window.Stickers.render(st, { showStats: false });
      const w = el('div', { class: 'cursor-pointer transition ' + (used.has(st.id) ? 'opacity-40' : 'hover:scale-105') }, [card]);
      w.addEventListener('click', () => {
        Store.update((state) => { const sl = findSlot(state, slotId); if (sl) sl.stickerId = st.id; });
        m.close();
        toast('Figurinha vinculada ao slot ✓', 'success');
        window.App.rerender();
      });
      list.appendChild(w);
    });
    window.UI.bindHolo(list);
  }

  function addPage() { Store.update((st) => st.album.pages.push(Store.makePage(6))); }
  function removePage(id) {
    confirm('Excluir esta página e seus vínculos?', () =>
      Store.update((st) => { st.album.pages = st.album.pages.filter((p) => p.id !== id); }), { yes: 'Excluir' });
  }
  function changeSlots(pageId, delta) {
    Store.update((st) => {
      const p = st.album.pages.find((x) => x.id === pageId); if (!p) return;
      if (delta > 0 && p.slots.length < 12) p.slots.push(Store.makeSlot());
      if (delta < 0 && p.slots.length > 1) p.slots.pop();
    });
  }

      st.stickers.push({ id: Store.uid('stk'), number: st._seq++, ...d, name: d.name.trim() });

    window.App.rerender();

  function openEdit(st) {
    const m = modal([stickerCreator({ ...st })], { size: 'max-w-md' });

    editModalRef = m;
    function patch() {}
  }
  let editModalRef = null;
  function saveEdit(edited) {
    if (!edited.name.trim()) { toast('Nome obrigatório', 'error'); return; }
    Store.update((st) => {
      const i = st.stickers.findIndex((x) => x.id === edited.id);
      if (i >= 0) st.stickers[i] = { ...st.stickers[i], ...edited, name: edited.name.trim() };

    toast('Atualizada!', 'success');

  function removeSticker(id) {
    confirm('Excluir esta figurinha? Ela será removida dos slots vinculados.', () => {
      Store.update((st) => {
        st.stickers = st.stickers.filter((x) => x.id !== id);
        st.album.pages.forEach((p) => p.slots.forEach((sl) => { if (sl.stickerId === id) sl.stickerId = null; }));
        delete st.player.owned[id];
        for (const k in st.player.placed) if (st.player.placed[k] === id) delete st.player.placed[k];
      });
    }, { yes: 'Excluir' });
  }
